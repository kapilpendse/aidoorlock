service: aidoorlock
frameworkVersion: '3'

provider:
  name: aws
  runtime: python3.12

# you can overwrite defaults here
  stage: dev
  region: ${file(.build/cloud_config.yml):hostRegion}

# IAM role for all Lambda functions in this service
  iamRoleStatements:
    - Effect: Allow
      Action: "s3:*"
      Resource: "*"
    - Effect: Allow
      Action:
        - "dynamodb:*"
        - "cloudwatch:DeleteAlarms"
        - "cloudwatch:DescribeAlarmHistory"
        - "cloudwatch:DescribeAlarms"
        - "cloudwatch:DescribeAlarmsForMetric"
        - "cloudwatch:GetMetricStatistics"
        - "cloudwatch:ListMetrics"
        - "cloudwatch:PutMetricAlarm"
        - "datapipeline:ActivatePipeline"
        - "datapipeline:CreatePipeline"
        - "datapipeline:DeletePipeline"
        - "datapipeline:DescribeObjects"
        - "datapipeline:DescribePipelines"
        - "datapipeline:GetPipelineDefinition"
        - "datapipeline:ListPipelines"
        - "datapipeline:PutPipelineDefinition"
        - "datapipeline:QueryObjects"
        - "iam:ListRoles"
        - "sns:CreateTopic"
        - "sns:DeleteTopic"
        - "sns:ListSubscriptions"
        - "sns:ListSubscriptionsByTopic"
        - "sns:ListTopics"
        - "sns:Subscribe"
        - "sns:Unsubscribe"
        - "sns:SetTopicAttributes"
        - "lambda:CreateFunction"
        - "lambda:ListFunctions"
        - "lambda:ListEventSourceMappings"
        - "lambda:CreateEventSourceMapping"
        - "lambda:DeleteEventSourceMapping"
        - "lambda:GetFunctionConfiguration"
        - "lambda:DeleteFunction"
      Resource: "*"
    - Effect: Allow
      Action:
        - "rekognition:*"
      Resource: "*"
    - Effect: Allow
      Action:
        - "iot:Connect"
        - "iot:Publish"
        - "iot:Subscribe"
        - "iot:Receive"
        - "iot:GetThingShadow"
        - "iot:UpdateThingShadow"
      Resource: "*"
    - Effect: Allow
      Action:
        - "sns:*"
      Resource: "*"
    - Effect: Allow
      Action:
        - "logs:CreateLogGroup"
        - "logs:CreateLogStream"
        - "logs:PutLogEvents"
      Resource: "arn:aws:logs:*:*:*"

functions:
  verifyFace:
    handler: lambda/verifyFace.lambda_handler
    name: aidoorlock-verifyFace
    environment:
      GUEST_INFO_TABLE_NAME: ${file(.build/cloud_config.yml):guestInfoTableName}
    events:
      - s3:
          bucket: ${file(.build/cloud_config.yml):bucketForImages}
          event: s3:ObjectCreated:*
          rules:
            - prefix: image
  smsDeliveryHandler:
    handler: lambda/smsDeliveryHandler.lambda_handler
    name: aidoorlock-smsDeliveryHandler
    environment:
      GUEST_INFO_TABLE_NAME: ${file(.build/cloud_config.yml):guestInfoTableName}
    events:
      # - cloudwatchLog: 'DirectPublishToPhoneNumber'
      # - cloudwatchLog: 'DirectPublishToPhoneNumber/Failure'
      - cloudwatchLog:
          logGroup: 'sns/${file(.build/cloud_config.yml):hostRegion}/${file(.build/cloud_config.yml):accountId}/DirectPublishToPhoneNumber'
      - cloudwatchLog:
          logGroup: 'sns/${file(.build/cloud_config.yml):hostRegion}/${file(.build/cloud_config.yml):accountId}/DirectPublishToPhoneNumber/Failure'


resources:
  Resources:
    AIDoorLockGuests:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${file(.build/cloud_config.yml):guestInfoTableName}
        AttributeDefinitions:
          - AttributeName: GuestId
            AttributeType: N
        KeySchema:
          - AttributeName: GuestId
            KeyType: HASH
        ProvisionedThroughput:
          ReadCapacityUnits: 1
          WriteCapacityUnits: 1
    LambdaInvokePermission:
      Type: "AWS::Lambda::Permission"
      Properties:
        FunctionName: "aidoorlock-smsDeliveryHandler"
        Action: "lambda:InvokeFunction"
        Principal: "logs.${file(.build/cloud_config.yml):hostRegion}.amazonaws.com"
        SourceAccount:
          Ref: "AWS::AccountId"
      DependsOn: SmsDeliveryHandlerLambdaFunction
    AIDoorLockLogGroup:
      Type: "AWS::Logs::LogGroup"
      Properties:
        LogGroupName: 'sns/${file(.build/cloud_config.yml):hostRegion}/${file(.build/cloud_config.yml):accountId}/DirectPublishToPhoneNumber'
        RetentionInDays: 14
    AIDoorLockFailureLogGroup:
      Type: "AWS::Logs::LogGroup"
      Properties:
        LogGroupName: 'sns/${file(.build/cloud_config.yml):hostRegion}/${file(.build/cloud_config.yml):accountId}/DirectPublishToPhoneNumber/Failure'
        RetentionInDays: 14
    AIDoorLockThing:
      Type: "AWS::IoT::Thing"
      Properties:
        ThingName: "${file(.build/cloud_config.yml):thingName}"
    AIDoorLockThingPolicy:
      Type: "AWS::IoT::Policy"
      Properties:
        PolicyName: "${file(.build/cloud_config.yml):thingName}_Policy"
        PolicyDocument:
          Version: "2012-10-17"
          Statement:
            -
              Effect: "Allow"
              Action:
                -
                  "iot:*"
              Resource:
                -
                  "*"
    AIDoorBellThing:
      Type: "AWS::IoT::Thing"
      Properties:
        ThingName: "${file(.build/cloud_config.yml):doorbellThingName}"
    AIDoorBellThingPolicy:
      Type: "AWS::IoT::Policy"
      Properties:
        PolicyName: "${file(.build/cloud_config.yml):doorbellThingName}_Policy"
        PolicyDocument:
          Version: "2012-10-17"
          Statement:
            -
              Effect: "Allow"
              Action:
                -
                  "iot:*"
              Resource:
                -
                  "*"
    AIDoorLockSNSSuccessFeedback:
      Type: "AWS::IAM::Role"
      Properties:
        RoleName: "AIDoorLockSNSSuccessFeedback"
        AssumeRolePolicyDocument:
          Version: "2012-10-17"
          Statement:
            -
              Effect: "Allow"
              Principal:
                Service:
                  - "sns.amazonaws.com"
              Action:
                - "sts:AssumeRole"
        Policies:
          -
            PolicyName: "AIDoorLockSNSSuccessFeedbackInlinePolicy"
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                -
                  Effect: "Allow"
                  Action:
                    - "logs:CreateLogGroup"
                    - "logs:CreateLogStream"
                    - "logs:PutLogEvents"
                    - "logs:PutMetricFilter"
                    - "logs:PutRetentionPolicy"
                  Resource: "*"
